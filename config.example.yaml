functions:
- id: find.files
  arg_descriptions:
    - Root dir
    - File regex
  list_cmd: fd --type f . {{arg.0}} | grep -E '{{arg.1}}' | sort -u
- id: list.folders
  arg_descriptions:
    - Root dir
    - File regex
  list_cmd: fd --type f . {{arg.0}} | grep -E '{{arg.1}}' | awk -F/ 'NF{NF--; print "/"$0}' OFS=/ | sort -u
  select_option_regex: ([^/]+)$
- id: list.zellij
  list_cmd: zellij list-sessions -ns
consts: {}
root_collection:
  id: root
  consts: {}
  targets:
  - name: Open log file
    id: open.log.file
    lister:
      type: function
      id: find.files
      args:
      - ~/.config/
      - .log$
    run_cmd: bat {{arg}}
  - name: Attach zellij session
    id: zellij.attach
    lister:
      type: function
      id: list.zellij
    run_cmd: zellij attach {{arg}}
